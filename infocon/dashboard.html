<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>5t1ck InfoCon</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb;
  --ink: #0b0b0b; --ink2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11,11,11,.10);
  --series: #2a78d6;
  --good: #0ca30c; --warn: #fab219; --serious: #ec835a; --crit: #d03b3b;
  --band: .07;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19;
    --ink: #f0efec; --ink2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255,255,255,.10);
    --series: #3987e5;
    --band: .09;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--page); color: var(--ink);
  font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
}
a { color: inherit; text-decoration-color: var(--axis); text-underline-offset: 2px; }
a:hover { text-decoration-color: currentColor; }
main { max-width: 1120px; margin: 0 auto; padding: 24px 16px 56px; }
header.top { display: flex; flex-wrap: wrap; gap: 4px 16px; align-items: baseline; justify-content: space-between; margin-bottom: 16px; }
header.top h1 { font-size: 15px; font-weight: 600; margin: 0; }
header.top .meta { color: var(--ink2); font-size: 13px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 20px; }
main > * + * { margin-top: 16px; }
main > header.top + *, main > .notice + * { margin-top: 0; }
h2 { font-size: 14px; font-weight: 600; margin: 0 0 2px; }
.sub { color: var(--ink2); font-size: 13px; margin: 0 0 12px; }
.notice { border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; margin-bottom: 16px; background: var(--surface); display: flex; gap: 10px; align-items: flex-start; }
.icon { display: inline-block; flex: none; vertical-align: -2px; }

/* hero */
.hero-row { display: flex; flex-wrap: wrap; gap: 16px 40px; align-items: flex-end; justify-content: space-between; }
.level { display: flex; align-items: center; gap: 14px; }
.level .word { font-size: 56px; line-height: 1; font-weight: 650; letter-spacing: -.01em; }
.stat .v { font-size: 28px; font-weight: 600; line-height: 1.1; }
.stat .v small { font-size: 14px; font-weight: 400; color: var(--ink2); }
.stat .k { color: var(--ink2); font-size: 12px; }
.stats { display: flex; gap: 32px; flex-wrap: wrap; }
.summary { font-size: 17px; margin: 14px 0 2px; }
.facts { color: var(--ink2); font-size: 13px; margin: 0; }
.scale { margin-top: 22px; }
.scale .bar { position: relative; display: flex; gap: 2px; height: 8px; }
.scale .seg { height: 8px; }
.scale .seg:first-child { border-radius: 4px 0 0 4px; }
.scale .seg:last-child { border-radius: 0 4px 4px 0; }
.scale .pin { position: absolute; top: -9px; width: 0; height: 0; margin-left: -6px;
  border-left: 6px solid transparent; border-right: 6px solid transparent; border-top: 8px solid var(--ink); }
.scale .labels { display: flex; gap: 2px; margin-top: 6px; font-size: 11px; color: var(--ink2); }
.scale .labels div { min-width: 0; line-height: 1.3; }
.scale .labels b { display: block; font-weight: 600; color: var(--ink); }
.drivers { list-style: none; margin: 18px 0 0; padding: 14px 0 0; border-top: 1px solid var(--grid); display: grid; gap: 8px; }
.drivers li { display: grid; grid-template-columns: 44px 1fr; gap: 10px; align-items: baseline; }
.num { font-variant-numeric: tabular-nums; }
.drivers .num { font-weight: 600; text-align: right; }
.tag { display: inline-block; font-size: 11px; line-height: 1.5; padding: 0 6px; border: 1px solid var(--border); border-radius: 999px; color: var(--ink2); white-space: nowrap; }

/* chart */
.card-head { display: flex; gap: 12px; justify-content: space-between; align-items: flex-start; }
.seg-btn { display: inline-flex; border: 1px solid var(--border); border-radius: 7px; overflow: hidden; flex: none; }
.seg-btn button { font: inherit; font-size: 12px; padding: 4px 10px; border: 0; background: transparent; color: var(--ink2); cursor: pointer; }
.seg-btn button[aria-pressed="true"] { background: var(--grid); color: var(--ink); font-weight: 600; }
.chart-wrap { position: relative; }
#chart svg { display: block; width: 100%; outline: none; }
#chart svg:focus-visible { outline: 2px solid var(--series); outline-offset: 2px; border-radius: 4px; }
#chart text { font: 11px system-ui, -apple-system, "Segoe UI", sans-serif; font-variant-numeric: tabular-nums; }
.tip { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 2; min-width: 190px;
  background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 9px 11px;
  box-shadow: 0 6px 20px rgba(0,0,0,.14); font-size: 12px; }
.tip .when { color: var(--ink2); }
.tip .main { display: flex; align-items: center; gap: 7px; margin: 3px 0 6px; font-size: 13px; }
.tip .main b { font-size: 16px; }
.tip .key { width: 12px; height: 2px; border-radius: 1px; background: var(--series); flex: none; }
.tip dl { display: grid; grid-template-columns: auto 1fr; gap: 1px 12px; margin: 0; border-top: 1px solid var(--grid); padding-top: 6px; }
.tip dt { font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
.tip dd { margin: 0; color: var(--ink2); }
.scroll { overflow: auto; }
#history-table { max-height: 320px; }

/* tables */
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: left; padding: 6px 12px 6px 0; border-bottom: 1px solid var(--grid); vertical-align: top; }
th { font-weight: 600; color: var(--ink2); font-size: 12px; white-space: nowrap; position: sticky; top: 0; background: var(--surface); }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td.nowrap { white-space: nowrap; }
td .dim, .dim { color: var(--ink2); }
.empty { color: var(--ink2); font-size: 13px; margin: 0; }

/* components */
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); }
.grid.two { grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); align-items: start; }
@media (max-width: 480px) { .grid.two, .grid { grid-template-columns: 1fr; } .level .word { font-size: 44px; } }
.comp-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.comp-head .score { font-size: 22px; font-weight: 600; display: flex; align-items: center; gap: 7px; }
.meter { position: relative; height: 8px; border-radius: 4px; margin: 10px 0 14px; }
.meter i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; }
.meter s { position: absolute; top: -2px; bottom: -2px; width: 2px; margin-left: -1px; background: var(--surface); }
.signals { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font-size: 13px; }
.signals li { display: grid; grid-template-columns: 34px 1fr; gap: 10px; }
.signals .num { font-weight: 600; text-align: right; }
.signals .off { color: var(--ink2); }
.signals .off .num { font-weight: 400; }

/* ranked bars */
.ranks { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
.ranks h3 { font-size: 12px; font-weight: 600; color: var(--ink2); margin: 0 0 6px; }
.rank { display: grid; grid-template-columns: minmax(0, 92px) 1fr; gap: 8px; align-items: center; font-size: 12px; padding: 2px 0; }
.rank .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rank .track { display: flex; align-items: center; gap: 6px; }
.rank .fill { height: 10px; min-width: 2px; background: var(--series); border-radius: 0 4px 4px 0; }
.rank:hover .fill { filter: brightness(1.15); }
details summary { cursor: pointer; font-weight: 600; }
details p, details li { color: var(--ink2); max-width: 78ch; }
details ul { padding-left: 18px; }
footer { color: var(--ink2); font-size: 12px; margin-top: 24px; display: flex; gap: 6px 16px; flex-wrap: wrap; }
.visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
</style>
</head>
<body>
<main id="app">
  <p class="card">No data yet. Run <code>python -m infocon run</code> to generate <code>site/data.js</code>.</p>
</main>
<script src="data.js"></script>
<script>
(function () {
"use strict";
const S = window.INFOCON_STATUS, HIST = window.INFOCON_HISTORY || [];
if (!S) return;

// ---------------------------------------------------------------- helpers
const SVGNS = "http://www.w3.org/2000/svg";
function el(tag, attrs, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === "class") n.className = v; else if (k === "text") n.textContent = v; else n.setAttribute(k, v);
  }
  for (const k of kids.flat()) if (k != null && k !== false) n.append(k);
  return n;
}
function svg(tag, attrs, text) {
  const n = document.createElementNS(SVGNS, tag);
  for (const [k, v] of Object.entries(attrs || {})) n.setAttribute(k, v);
  if (text != null) n.textContent = text;
  return n;
}
const LEVELS = (S.method && S.method.levels) || [["GREEN", 0], ["YELLOW", 35], ["ORANGE", 55], ["RED", 75]];
const VAR = { GREEN: "--good", YELLOW: "--warn", ORANGE: "--serious", RED: "--crit" };
const color = (lv) => `var(${VAR[lv] || "--muted"})`;
const levelFor = (score) => LEVELS.reduce((acc, [name, floor]) => (score >= floor ? name : acc), LEVELS[0][0]);
const SHAPES = {   // one distinct shape per level, so level never rides on color alone
  GREEN:  ['<circle cx="8" cy="8" r="7.2"/>', '<path d="M4.7 8.3l2.2 2.3 4.4-4.9" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>', "#ffffff"],
  YELLOW: ['<path d="M8 1.3 15.2 14.2H.8z" stroke-width="1.2" stroke-linejoin="round"/>', '<path d="M8 6.2v3.9" fill="none" stroke-width="1.7" stroke-linecap="round"/><circle cx="8" cy="12.1" r=".95" stroke="none"/>', "#0b0b0b"],
  ORANGE: ['<path d="M8 .7 15.3 8 8 15.3.7 8z"/>', '<path d="M8 4.6v4.1" fill="none" stroke-width="1.7" stroke-linecap="round"/><circle cx="8" cy="11.1" r=".95" stroke="none"/>', "#ffffff"],
  RED:    ['<path d="M5 .9h6L15.1 5v6L11 15.1H5L.9 11V5z"/>', '<path d="M5.5 5.5l5 5m0-5l-5 5" fill="none" stroke-width="1.8" stroke-linecap="round"/>', "#ffffff"],
};
function icon(level, size) {
  const s = SHAPES[level];
  const span = el("span", { class: "icon", role: "img", "aria-label": level });
  if (!s) return span;
  span.innerHTML = `<svg viewBox="0 0 16 16" width="${size || 14}" height="${size || 14}" aria-hidden="true">` +
    `<g fill="${color(level)}" stroke="${color(level)}">${s[0]}</g><g fill="${s[2]}" stroke="${s[2]}">${s[1]}</g></svg>`;
  return span;
}
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1).toLowerCase();
const int = (n) => (n == null ? "–" : Math.round(n).toLocaleString("en-US"));
const one = (n) => (n == null ? "–" : n.toFixed(1));
const pct = (p) => (p == null ? "–" : p >= 0.995 ? ">99%" : (p * 100).toFixed(p < 0.1 ? 1 : 0) + "%");
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const dayUTC = (d) => `${MONTHS[d.getUTCMonth()]} ${d.getUTCDate()}`;
const stampUTC = (d) => `${dayUTC(d)}, ${String(d.getUTCHours()).padStart(2, "0")}:${String(d.getUTCMinutes()).padStart(2, "0")} UTC`;
function ago(ts) {
  const d = new Date(ts); if (isNaN(d)) return "";
  const m = Math.max(0, (Date.now() - d) / 60000);
  if (m < 1.5) return "just now";
  if (m < 90) return `${Math.round(m)} min ago`;
  if (m < 36 * 60) return `${Math.round(m / 60)} h ago`;
  return `${Math.round(m / 1440)} days ago`;
}
const CVE = /^CVE-\d{4}-\d{4,}$/;
function cveLink(id) {
  return CVE.test(id) ? el("a", { href: "https://nvd.nist.gov/vuln/detail/" + id, target: "_blank", rel: "noopener noreferrer", text: id }) : el("span", { text: id });
}
function extLink(url, text) {
  return /^https:\/\//.test(url || "") ? el("a", { href: url, target: "_blank", rel: "noopener noreferrer", text }) : el("span", { text });
}
function table(cols, rows) {
  const t = el("table");
  t.append(el("thead", null, el("tr", null, cols.map((c) => el("th", { class: c.cls, text: c.h })))));
  const body = el("tbody");
  for (const r of rows) body.append(el("tr", null, cols.map((c) => { const td = el("td", { class: c.cls }); const v = c.v(r); td.append(v == null ? "–" : v); return td; })));
  t.append(body);
  return el("div", { class: "scroll" }, t);
}
function card(title, sub, ...body) {
  return el("section", { class: "card" }, el("h2", { text: title }), sub ? el("p", { class: "sub", text: sub }) : null, ...body);
}
const clip = (s, n) => (s && s.length > n ? s.slice(0, n - 1).trimEnd() + "…" : s || "");
const H = S.highlights || {};
const app = document.getElementById("app");
app.replaceChildren();

// ----------------------------------------------------------------- header
const generated = new Date(S.generated);
const ageH = (Date.now() - generated) / 3.6e6;
app.append(el("header", { class: "top" },
  el("h1", { text: "5t1ck InfoCon" }),
  el("div", { class: "meta", title: generated.toString(), text: `Computed automatically from ${S.sources.length} public feeds · updated ${ago(S.generated)}` })));
document.title = `${S.level}${S.score == null ? "" : " " + Math.round(S.score)} · 5t1ck InfoCon`;
(function favicon() {
  const hex = { GREEN: "#0ca30c", YELLOW: "#fab219", ORANGE: "#ec835a", RED: "#d03b3b" }[S.level] || "#898781";
  const link = el("link", { rel: "icon", href: "data:image/svg+xml," + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7" fill="${hex}"/></svg>`) });
  document.head.append(link);
})();
if (ageH > 3) app.append(el("div", { class: "notice" }, icon("YELLOW", 16),
  el("div", { text: `This reading is ${ago(S.generated).replace(" ago", "")} old. The collector may not be running; start it with "python -m infocon serve" or schedule "python -m infocon run".` })));
if (S.degraded) app.append(el("div", { class: "notice" }, icon("YELLOW", 16),
  el("div", { text: `Only ${Math.round((S.coverage || 0) * 100)}% of the scoring weight is reachable right now, so the level is being held rather than recomputed. See feed health below.` })));

// ------------------------------------------------------------------- hero
(function hero() {
  const sans = S.sans_infocon ? cap(S.sans_infocon) : "unknown";
  const since = S.level_since ? new Date(S.level_since) : null;
  const facts = [];
  if (since && !isNaN(since)) facts.push(`${cap(S.level)} since ${stampUTC(since)}`);
  if (S.raw_level && S.raw_level !== S.level) facts.push(`score alone would read ${cap(S.raw_level)}`);
  facts.push(`${Math.round((S.coverage || 0) * 100)}% of feeds by weight reporting`);

  const scale = el("div", { class: "scale", role: "img", "aria-label": `Score ${S.score == null ? "unavailable" : Math.round(S.score)} on a 0 to 100 scale; ${LEVELS.map(([n, f]) => `${cap(n)} from ${f}`).join(", ")}` });
  const bar = el("div", { class: "bar" }), labels = el("div", { class: "labels" });
  LEVELS.forEach(([name, floor], i) => {
    const top = i + 1 < LEVELS.length ? LEVELS[i + 1][1] : 100;
    bar.append(el("div", { class: "seg", style: `flex:${top - floor} 0 0;background:${color(name)}` }));
    labels.append(el("div", { style: `flex:${top - floor} 0 0` }, el("b", { text: cap(name) }), i + 1 < LEVELS.length ? `${floor}–${top - 1}` : `${floor}+`));
  });
  if (S.score != null) bar.append(el("div", { class: "pin", style: `left:${Math.min(100, Math.max(0, S.score))}%` }));
  scale.append(bar, labels);

  const drivers = el("ul", { class: "drivers" });
  for (const d of S.drivers || []) {
    const comp = (S.components.find((c) => c.id === d.component) || {}).label || d.component;
    drivers.append(el("li", null, el("span", { class: "num", text: one(d.score) }),
      el("span", null, el("b", { text: comp + ": " }), d.text)));
  }
  if (!drivers.children.length) drivers.append(el("li", null, el("span"), el("span", { class: "dim", text: "No signal is above its normal range." })));

  app.append(el("section", { class: "card" },
    el("div", { class: "hero-row" },
      el("div", { class: "level" }, icon(S.level, 48), el("div", { class: "word", text: S.level })),
      el("div", { class: "stats" },
        el("div", { class: "stat" }, el("div", { class: "v" }, S.score == null ? "n/a" : String(Math.round(S.score)), el("small", { text: " / 100" })), el("div", { class: "k", text: "Composite score" })),
        el("div", { class: "stat" }, el("div", { class: "v", text: sans }), el("div", { class: "k", text: "SANS InfoCon (set by hand)" })))),
    el("p", { class: "summary", text: S.summary }),
    el("p", { class: "facts", text: facts.join(" · ") }),
    scale,
    el("h2", { class: "visually-hidden", text: "What is driving the score" }),
    drivers));
})();

// ---------------------------------------------------------------- history
const pts = HIST.map((p) => ({ ...p, d: new Date(p.t) })).filter((p) => !isNaN(p.d) && p.score != null);
(function history() {
  if (pts.length < 2) return;
  const days = Math.round((pts[pts.length - 1].d - pts[0].d) / 864e5);
  const firstLive = pts.find((p) => !p.bf);
  const sub = "Composite score, 0–100." + (pts[0].bf ? ` Days before ${firstLive ? dayUTC(firstLive.d) : "the first live run"} are reconstructed from feeds that keep history, without the live-only signals.` : "");
  const chart = el("div", { id: "chart" }), tip = el("div", { class: "tip", hidden: "" });
  const wrap = el("div", { class: "chart-wrap" }, chart, tip);
  const tbl = el("div", { id: "history-table", class: "scroll", hidden: "" });
  const bChart = el("button", { type: "button", "aria-pressed": "true", text: "Chart" });
  const bTable = el("button", { type: "button", "aria-pressed": "false", text: "Table" });
  const show = (which) => {
    wrap.hidden = which !== "chart"; tbl.hidden = which !== "table";
    bChart.setAttribute("aria-pressed", String(which === "chart")); bTable.setAttribute("aria-pressed", String(which === "table"));
    if (which === "table" && !tbl.firstChild) buildTable(); else if (which === "chart") draw();
  };
  bChart.onclick = () => show("chart"); bTable.onclick = () => show("table");
  app.append(el("section", { class: "card" },
    el("div", { class: "card-head" },
      el("div", null, el("h2", { text: `Threat level, last ${days} days` }), el("p", { class: "sub", text: sub })),
      el("div", { class: "seg-btn", role: "group", "aria-label": "View" }, bChart, bTable)),
    wrap, tbl));

  const comps = S.components.map((c) => [c.id, c.label]);
  function buildTable() {
    const cols = [
      { h: "When (UTC)", cls: "nowrap", v: (p) => stampUTC(p.d) + (p.bf ? " (reconstructed)" : "") },
      { h: "Score", cls: "num", v: (p) => one(p.score) },
      { h: "Level", cls: "nowrap", v: (p) => el("span", null, icon(p.level, 12), " " + cap(p.level)) },
      ...comps.map(([id, label]) => ({ h: label, cls: "num", v: (p) => one(p.c && p.c[id]) })),
    ];
    tbl.append(table(cols, pts.slice().reverse()).firstChild);
  }

  let active = -1;
  function draw() {
    const W = Math.max(320, chart.clientWidth), Hh = 280, m = { l: 30, r: 78, t: 16, b: 26 };
    const iw = W - m.l - m.r, ih = Hh - m.t - m.b;
    const t0 = +pts[0].d, t1 = +pts[pts.length - 1].d;
    const x = (t) => m.l + ((t - t0) / (t1 - t0)) * iw, y = (v) => m.t + (1 - v / 100) * ih;
    const root = svg("svg", { viewBox: `0 0 ${W} ${Hh}`, height: Hh, tabindex: "0", role: "img",
      "aria-label": `Line chart of the composite threat score over the last ${days} days. Latest ${one(pts[pts.length - 1].score)}, ${pts[pts.length - 1].level}. Use the arrow keys to step through readings, or switch to the table view.` });

    // level bands: faint wash + hairline floor + name in the right margin
    LEVELS.forEach(([name, floor], i) => {
      const top = i + 1 < LEVELS.length ? LEVELS[i + 1][1] : 100;
      const band = svg("rect", { x: m.l, y: y(top), width: iw, height: y(floor) - y(top), fill: color(name) });
      band.style.opacity = "var(--band)";
      root.append(band);
      root.append(svg("line", { x1: m.l, x2: m.l + iw, y1: y(floor), y2: y(floor), stroke: i ? "var(--grid)" : "var(--axis)", "stroke-width": 1 }));
      root.append(svg("text", { x: m.l - 6, y: y(floor) + 4, "text-anchor": "end", fill: "var(--muted)" }, String(floor)));
      const mid = (y(top) + y(floor)) / 2;
      const g = svg("g", { transform: `translate(${m.l + iw + 8},${mid - 6})` });
      g.innerHTML = `<g fill="${color(name)}" stroke="${color(name)}" transform="scale(.75)">${SHAPES[name] ? SHAPES[name][0] : ""}</g>`;
      root.append(g);
      root.append(svg("text", { x: m.l + iw + 24, y: mid + 4, fill: "var(--ink2)" }, cap(name)));
    });
    root.append(svg("text", { x: m.l - 6, y: y(100) + 4, "text-anchor": "end", fill: "var(--muted)" }, "100"));

    // x ticks on UTC midnights
    const span = (t1 - t0) / 864e5, step = [1, 2, 7, 14, 28, 56].find((s) => span / s <= Math.max(3, iw / 90)) || 56;
    const first = new Date(t0); first.setUTCHours(24, 0, 0, 0);
    for (let t = +first; t <= t1; t += step * 864e5) {
      if (x(t) > m.l + iw - 18) break;
      root.append(svg("line", { x1: x(t), x2: x(t), y1: m.t + ih, y2: m.t + ih + 4, stroke: "var(--axis)" }));
      root.append(svg("text", { x: x(t), y: m.t + ih + 17, "text-anchor": "middle", fill: "var(--muted)" }, dayUTC(new Date(t))));
    }

    const path = pts.map((p, i) => `${i ? "L" : "M"}${x(+p.d).toFixed(1)},${y(p.score).toFixed(1)}`).join("");
    root.append(svg("path", { d: path, fill: "none", stroke: "var(--series)", "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));
    const last = pts[pts.length - 1];
    root.append(svg("circle", { cx: x(t1), cy: y(last.score), r: 5, fill: "var(--series)", stroke: "var(--surface)", "stroke-width": 2 }));
    const endLabel = svg("text", { x: x(t1) + 5, y: y(last.score) - 12, "text-anchor": "end", fill: "var(--ink)", "font-weight": 600,
      stroke: "var(--surface)", "stroke-width": 3, "paint-order": "stroke" }, one(last.score));
    root.append(endLabel);

    const cross = svg("line", { y1: m.t, y2: m.t + ih, stroke: "var(--axis)", "stroke-width": 1, visibility: "hidden" });
    const dot = svg("circle", { r: 5, fill: "var(--series)", stroke: "var(--surface)", "stroke-width": 2, visibility: "hidden" });
    const hit = svg("rect", { x: m.l, y: m.t, width: iw + 10, height: ih, fill: "transparent" });
    root.append(cross, dot, hit);

    function select(i) {
      active = i;
      if (i < 0) { cross.setAttribute("visibility", "hidden"); dot.setAttribute("visibility", "hidden"); tip.hidden = true; return; }
      const p = pts[i], px = x(+p.d), py = y(p.score);
      cross.setAttribute("x1", px); cross.setAttribute("x2", px); cross.setAttribute("visibility", "visible");
      dot.setAttribute("cx", px); dot.setAttribute("cy", py); dot.setAttribute("visibility", "visible");
      const dl = el("dl");
      for (const [id, label] of comps) dl.append(el("dt", { text: one(p.c && p.c[id]) }), el("dd", { text: label }));
      tip.replaceChildren(
        el("div", { class: "when", text: (p.bf ? dayUTC(p.d) : stampUTC(p.d)) + (p.bf ? " · reconstructed" : "") }),
        el("div", { class: "main" }, el("span", { class: "key" }), el("b", { text: one(p.score) }), icon(p.level, 13), el("span", { text: cap(p.level) })),
        dl);
      tip.hidden = false;
      const scale = chart.clientWidth / W, tw = tip.offsetWidth, left = px * scale + 14;
      tip.style.left = (left + tw > chart.clientWidth ? px * scale - tw - 14 : left) + "px";
      tip.style.top = Math.max(0, Math.min(Hh - tip.offsetHeight, py - 30)) + "px";
    }
    function nearest(clientX) {
      const r = root.getBoundingClientRect(), t = t0 + (((clientX - r.left) * (W / r.width) - m.l) / iw) * (t1 - t0);
      let lo = 0, hi = pts.length - 1;
      while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (+pts[mid].d < t) lo = mid; else hi = mid; }
      return t - pts[lo].d < pts[hi].d - t ? lo : hi;
    }
    hit.addEventListener("pointermove", (e) => select(nearest(e.clientX)));
    hit.addEventListener("pointerdown", (e) => select(nearest(e.clientX)));
    hit.addEventListener("pointerleave", () => { if (document.activeElement !== root) select(-1); });
    root.addEventListener("focus", () => { if (active < 0) select(pts.length - 1); });
    root.addEventListener("blur", () => select(-1));
    root.addEventListener("keydown", (e) => {
      const move = { ArrowLeft: -1, ArrowRight: 1, PageUp: -7, PageDown: 7 }[e.key];
      let i = active < 0 ? pts.length - 1 : active;
      if (move) i += move; else if (e.key === "Home") i = 0; else if (e.key === "End") i = pts.length - 1; else if (e.key === "Escape") { select(-1); return; } else return;
      e.preventDefault(); select(Math.max(0, Math.min(pts.length - 1, i)));
    });
    chart.replaceChildren(root);
    tip.hidden = true; active = -1;
  }
  draw();
  let lastW = chart.clientWidth;
  new ResizeObserver(() => { if (!wrap.hidden && chart.clientWidth !== lastW) { lastW = chart.clientWidth; draw(); } }).observe(chart);
})();

// ------------------------------------------------------------- components
(function components() {
  const grid = el("div", { class: "grid" });
  for (const c of S.components) {
    const lv = c.score == null ? null : levelFor(c.score);
    const meter = el("div", { class: "meter", style: `background:color-mix(in srgb, ${lv ? color(lv) : "var(--muted)"} 20%, var(--surface))`,
      role: "img", "aria-label": c.score == null ? `${c.label}: unavailable` : `${c.label}: ${one(c.score)} of 100, ${lv}` });
    if (c.score != null) meter.append(el("i", { style: `width:${Math.max(1.5, Math.min(100, c.score))}%;background:${color(lv)}` }));
    LEVELS.slice(1).forEach(([, floor]) => meter.append(el("s", { style: `left:${floor}%` })));
    const sig = el("ul", { class: "signals" });
    for (const s of c.signals || []) {
      sig.append(el("li", { class: s.counted ? null : "off" }, el("span", { class: "num", text: one(s.score) }),
        el("span", null, s.text, s.counted ? null : " ", s.counted ? null : el("span", { class: "tag", title: "Live-only signals count toward the component only once they pass their firing threshold", text: "context only" }))));
    }
    if (c.score == null) sig.append(el("li", { class: "off" }, el("span"), el("span", { text: "Feed unavailable, so this component is left out and the other weights are rescaled." })));
    grid.append(el("section", { class: "card" },
      el("div", { class: "comp-head" },
        el("div", null, el("h2", { text: c.label }), el("div", { class: "dim", style: "font-size:12px", text: `${Math.round(c.weight * 100)}% of the composite` })),
        el("div", { class: "score" }, lv ? icon(lv, 16) : null, c.score == null ? "n/a" : one(c.score))),
      meter, sig));
  }
  app.append(grid);
})();

// ------------------------------------------------------------- highlights
(function highlights() {
  const grid = el("div", { class: "grid two" });
  const yes = (flag, text) => (flag ? el("span", { class: "tag", text }) : null);

  if (H.incidents) grid.append(card("Big-service incidents", `Open now or resolved in the last 24 hours, worst first, from the status pages of ${(H.providers_checked || []).length} major services: ${(H.providers_checked || []).join(", ")}.`,
    H.incidents.length ? table([
      { h: "Service", cls: "nowrap", v: (r) => r.provider },
      { h: "Incident", v: (r) => extLink(r.url, clip(r.title, 100)) },
      { h: "Impact", cls: "nowrap", v: (r) => r.impact },
      { h: "Status", cls: "nowrap", v: (r) => (r.ended ? `resolved ${ago(r.ended) || ""}` : el("b", { text: `ongoing, ${r.first_seen ? "first seen" : "began"} ${ago(r.started) || "?"}` })) },
    ], H.incidents) : el("p", { class: "empty", text: "No incidents." })));

  if (H.stories) grid.append(card("On the Hacker News front page", "Outage and security stories from the last 24 hours. Their combined points feed the Outages and Security buzz scores.",
    H.stories.length ? table([
      { h: "Points", cls: "num", v: (r) => int(r.points) },
      { h: "Story", v: (r) => extLink(r.url, clip(r.title, 110)) },
      { h: "Kind", cls: "nowrap", v: (r) => r.kind },
      { h: "Posted", cls: "nowrap", v: (r) => ago(r.posted) || "–" },
    ], H.stories) : el("p", { class: "empty", text: "Nothing relevant on the front page." })));

  if (H.kev_recent) grid.append(card("Newly confirmed exploited", `Added to CISA's Known Exploited Vulnerabilities catalog in the last 10 days (catalog ${H.kev_version || ""}).`,
    H.kev_recent.length ? table([
      { h: "Added", cls: "nowrap", v: (r) => dayUTC(new Date(r.added + "T00:00:00Z")) },
      { h: "CVE", cls: "nowrap", v: (r) => cveLink(r.cve) },
      { h: "Vulnerability", v: (r) => el("span", null, clip(r.name, 110), r.ransomware ? " " : null, yes(r.ransomware, "used by ransomware")) },
      { h: "EPSS", cls: "num", v: (r) => pct(r.epss) },
    ], H.kev_recent) : el("p", { class: "empty", text: "Nothing added in the last 10 days." })));

  if (H.weaponised) grid.append(card("Fresh criticals likely being exploited", "Critical CVEs published in the last 30 days that EPSS already rates at 10% or more.",
    H.weaponised.length ? table([
      { h: "CVE", cls: "nowrap", v: (r) => cveLink(r.cve) },
      { h: "CVSS", cls: "num", v: (r) => (r.score == null ? "–" : r.score.toFixed(1)) },
      { h: "EPSS", cls: "num", v: (r) => pct(r.epss) },
      { h: "Summary", v: (r) => el("span", null, clip(r.desc, 130), r.kev ? " " : null, yes(r.kev, "in KEV")) },
    ], H.weaponised) : el("p", { class: "empty", text: "None right now." })));

  const cveTable = (rows, countHead) => table([
    { h: "CVE", cls: "nowrap", v: (r) => cveLink(r.cve) },
    { h: "What", v: (r) => el("span", null, r.title ? clip(r.title, 90) : el("span", { class: "dim", text: "no title published" }), r.kev ? " " : null, yes(r.kev, "in KEV")) },
    { h: countHead, cls: "num", v: (r) => int(r.count) },
    { h: "EPSS", cls: "num", v: (r) => pct(r.epss) },
  ], rows);
  if (H.trending && H.trending.length) grid.append(card("Most talked-about vulnerabilities", "Sightings across social media, news, advisories and exploit feeds, collected by CIRCL.", cveTable(H.trending, "Sightings")));
  if (H.exploited && H.exploited.length) grid.append(card("Seen exploited in the wild", "Exploitation sightings reported to CIRCL (mostly honeypot data). Shown for context; not scored.", cveTable(H.exploited, "Reports")));

  if (H.ransomware) {
    const r = H.ransomware, ranks = el("div", { class: "ranks" });
    for (const [title, rows] of [["Groups", r.groups], ["Countries", r.countries], ["Sectors", r.sectors]]) {
      const max = Math.max(1, ...rows.map((x) => x.count)), box = el("div", null, el("h3", { text: title }));
      for (const x of rows) box.append(el("div", { class: "rank", title: `${x.name}: ${x.count} victims` },
        el("span", { class: "name", text: x.name }),
        el("span", { class: "track" }, el("span", { class: "fill", style: `width:${(x.count / max) * 72}%` }), el("span", { class: "num", text: String(x.count) }))));
      ranks.append(box);
    }
    grid.append(card("Ransomware", `${r.count_72h}${r.capped ? "+" : ""} organisations posted to leak sites in the last 72 hours (ransomware.live). Top six of each shown.`, ranks));
  }

  if (H.ports && H.ports.length) grid.append(card("Most-attacked ports", "DShield sensor reports for the last full day, against each port's own 3-week norm.",
    table([
      { h: "Port", cls: "num", v: (r) => String(r.port) },
      { h: "Attacking IPs", cls: "num", v: (r) => int(r.sources) },
      { h: "Usual", cls: "num", v: (r) => int(r.baseline_sources) },
      { h: "vs usual", cls: "num", v: (r) => (r.ratio == null ? "–" : el("span", null, r.ratio >= 2 ? el("b", { text: r.ratio.toFixed(1) + "×" }) : r.ratio.toFixed(1) + "×")) },
      { h: "Reports", cls: "num", v: (r) => int(r.records) },
    ], H.ports)));

  if (H.outages) grid.append(card("Country-level Internet outages", "IODA alerts from the last 24 hours. Only outages seen by two independent measurement methods are scored.",
    H.outages.length ? table([
      { h: "Country", v: (r) => r.name },
      { h: "Severity", cls: "num", v: (r) => int(r.score) },
      { h: "Seen by", cls: "nowrap", v: (r) => (r.via || []).join(", ") },
      { h: "Read as", v: (r) => (r.corroborated ? "corroborated, scored" : r.chronic ? "single source, flagged most days" : "single source, not scored") },
    ], H.outages) : el("p", { class: "empty", text: "No outage alerts." })));

  if (grid.children.length) app.append(grid);
})();

// ------------------------------------------------------- feeds and method
(function feeds() {
  const weights = (S.method && S.method.weights) || {};
  app.append(card("Feed health", "Every feed is free and needs no API key. A feed that fails is left out and the remaining weights are rescaled.",
    table([
      { h: "Feed", v: (r) => extLink(r.url, r.name) },
      { h: "Status", cls: "nowrap", v: (r) => el("span", null, icon(r.ok ? "GREEN" : "RED", 12), r.ok ? " OK" : " Unavailable") },
      { h: "Fetch time", cls: "num", v: (r) => (r.seconds == null ? "–" : r.seconds.toFixed(1) + " s") },
      { h: "Note", v: (r) => r.note || "" },
    ], S.sources)));

  const hold = (S.method && S.method.hold_hours) || 6, margin = (S.method && S.method.margin) || 3;
  app.append(el("section", { class: "card" }, el("details", null,
    el("summary", { text: "How the level is computed" }),
    el("p", { text: "Each signal is compared with its own recent history using a robust z-score (median and MAD, on a log scale for heavy-tailed counts), then mapped to 0–100 so an ordinary day scores about 20. Signals with no meaningful baseline use fixed curves instead: a port surge, fresh criticals with high EPSS, Hacker News front-page points, and incidents at big services. An incident is worth its severity times the size of the service, so one major outage at Microsoft 365, AWS, Google, Cloudflare or Apple is enough for Yellow by itself, and it keeps counting for some hours after it is fixed." }),
    el("p", { text: `Each component is 70% its loudest signal plus 30% the average. The composite is a weighted power mean (p=${(S.method && S.method.power) || 4}) of the components, so one alarming area lifts the level without a single noisy feed being able to push it to Red on its own. Weights: ${S.components.map((c) => `${c.label} ${Math.round((weights[c.id] ?? c.weight) * 100)}%`).join(", ")}.` }),
    el("p", { text: `Levels: ${LEVELS.map(([n, f]) => `${cap(n)} from ${f}`).join(", ")}. The level rises as soon as the score crosses a floor, and falls only after the score has stayed ${margin} points under that floor for ${hold} hours, so it does not flap.` }),
    el("p", { text: "Limits worth knowing: active exploitation rests on a single feed (CISA KEV), the Orange and Red floors have not yet been tested against a real major incident, and reconstructed history leaves out port surges, EPSS and the status pages that publish no history (Microsoft, Azure)." }))));

  app.append(el("footer", null,
    el("span", { text: `Generated ${stampUTC(generated)}` }),
    el("a", { href: "status.json", text: "status.json" }), el("a", { href: "history.json", text: "history.json" }),
    el("a", { href: "badge.svg", text: "badge.svg" }), el("a", { href: "status.txt", text: "status.txt" })));
})();

setTimeout(() => location.reload(), 5 * 60 * 1000);
})();
</script>
