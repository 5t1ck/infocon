# Recompute the level every 30 minutes and publish the dashboard to GitHub Pages.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
name: infocon

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: infocon
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      # Optional repo variable: a User-Agent with contact details, as SANS ISC asks of API users.
      INFOCON_USER_AGENT: ${{ vars.INFOCON_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # data/ (feed cache, score history, hysteresis state) rides along in the Actions cache.
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: data
          key: infocon-data-${{ github.run_id }}
          restore-keys: infocon-data-

      - name: Seed history on first run
        run: test -f data/history.jsonl || python -m infocon backfill --days 75

      - name: Collect and score
        # Exit code 2 means "published, but too few feeds answered" - still worth deploying.
        run: python -m infocon run || test $? -eq 2

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: infocon-data-${{ github.run_id }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
